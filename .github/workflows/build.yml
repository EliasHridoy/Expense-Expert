name: Build Only
'on':
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./expense-expert
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './expense-expert/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build
